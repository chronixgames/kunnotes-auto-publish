name: Kunnotes 30-Day Tistory Reservation

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to reserve'
        required: true
        default: '30'
        type: string
  push:
    paths:
      - '.github/reserve-month-trigger.json'

permissions:
  contents: read

jobs:
  reserve:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Seoul
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
      TISTORY_STORAGE_STATE_1: ${{ secrets.TISTORY_STORAGE_STATE }}
      TISTORY_STORAGE_STATE_2: ${{ secrets.TISTORY_STORAGE_STATE_1 }}
      TISTORY_STORAGE_STATE_3: ${{ secrets.TISTORY_STORAGE_STATE_2 }}
      OPENAI_MODEL: gpt-5.2
      RESERVE_DAYS: ${{ inputs.days || '30' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Kunnotes post rules
        run: python scripts/apply_post_rules.py

      - name: Apply final Kunnotes formatting rules
        run: python scripts/apply_final_rules.py

      - name: Disable tables for text-first posts
        run: python scripts/disable_tables.py

      - name: Enforce final media and closing rules
        run: python scripts/enforce_media_rules.py

      - name: Repair runtime publisher rules
        run: python scripts/repair_runtime_rules.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Normalize Tistory storage state
        env:
          STATE_A: ${{ secrets.TISTORY_STORAGE_STATE }}
          STATE_B: ${{ secrets.TISTORY_STORAGE_STATE_1 }}
          STATE_C: ${{ secrets.TISTORY_STORAGE_STATE_2 }}
        run: |
          python - <<'PY'
          import base64, gzip, json, os

          chunks = [os.environ.get('STATE_A', ''), os.environ.get('STATE_B', ''), os.environ.get('STATE_C', '')]
          chunks = [''.join(x.split()) for x in chunks if x.strip()]
          if not chunks:
              raise SystemExit('No Tistory storage-state secrets were found.')

          def decode_b64(value):
              return base64.b64decode(value + '=' * (-len(value) % 4), validate=True)

          def valid(raw):
              candidates = [raw]
              if raw[:2] == b'\x1f\x8b':
                  try:
                      candidates.insert(0, gzip.decompress(raw))
                  except Exception:
                      pass
              for candidate in candidates:
                  try:
                      text = candidate.decode('utf-8').strip()
                      if text.startswith('{'):
                          json.loads(text)
                          return candidate
                  except Exception:
                      pass
              return None

          attempts = []
          joined = ''.join(chunks)
          try:
              attempts.append(('joined-base64', decode_b64(joined)))
          except Exception as exc:
              print(f'joined-base64 decode failed: {type(exc).__name__}')
          try:
              pieces = [decode_b64(x) for x in chunks]
              attempts.append(('per-secret-base64', b''.join(pieces)))
          except Exception as exc:
              print(f'per-secret-base64 decode failed: {type(exc).__name__}')
          try:
              attempts.append(('first-secret-only', decode_b64(chunks[0])))
          except Exception:
              pass

          normalized = None
          method = None
          for name, raw in attempts:
              candidate = valid(raw)
              if candidate is not None:
                  normalized = candidate
                  method = name
                  break
          if normalized is None:
              raise SystemExit('Tistory storage-state could not be decoded. Refresh the session state.')

          encoded = base64.b64encode(normalized).decode('ascii')
          print(f'Validated Tistory storage state using {method}; normalized length={len(encoded)}.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('TISTORY_STORAGE_STATE_1<<TISTORY_STATE\n')
              f.write(encoded + '\n')
              f.write('TISTORY_STATE\n')
              f.write('TISTORY_STORAGE_STATE_2=\n')
              f.write('TISTORY_STORAGE_STATE_3=\n')
          PY

      - name: Check Tistory login session
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('src').resolve()))
          from publisher import _load_state
          from playwright.sync_api import sync_playwright

          blog = os.environ.get('TISTORY_BLOG_NAME', 'kunnotes').strip()
          state_path = _load_state()
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(storage_state=str(state_path))
              page = context.new_page()
              try:
                  page.goto(f'https://{blog}.tistory.com/manage/newpost/?type=post', wait_until='domcontentloaded', timeout=60000)
                  page.wait_for_timeout(2000)
                  url = page.url.lower()
                  if 'login' in url or 'accounts.kakao' in url:
                      raise SystemExit('TISTORY_SESSION_EXPIRED: refresh the Tistory session state before reservation.')
                  page.locator("#post-title-inp, input[placeholder*='제목'], input[name='title']").first.wait_for(state='visible', timeout=20000)
                  print('TISTORY_SESSION_OK=true')
              finally:
                  browser.close()
          PY

      - name: Reserve 30 days x 2 posts
        run: python scripts/reserve_month.py

      - name: Upload reservation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: month-reservation-${{ github.run_id }}
          path: out/month-reservation-result.json
          if-no-files-found: warn
          retention-days: 30
