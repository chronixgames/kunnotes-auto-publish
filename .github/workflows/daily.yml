name: Kunnotes Daily Publisher

on:
  schedule:
    # GitHub Actions cron is UTC. These start windows at 08:00, 12:00, 21:00 KST.
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish the generated post to Tistory'
        required: true
        default: false
        type: boolean
      topic:
        description: 'Optional topic for a one-off manual post'
        required: false
        default: '2026년 하반기 금리 인하 가능성, 투자자는 무엇을 준비해야 할까?'
        type: string
      image_urls:
        description: 'Optional comma-separated direct image URLs for a manual override'
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/publish-trigger.json'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
      TISTORY_STORAGE_STATE_1: ${{ secrets.TISTORY_STORAGE_STATE_1 }}
      TISTORY_STORAGE_STATE_2: ${{ secrets.TISTORY_STORAGE_STATE_2 }}
      TISTORY_STORAGE_STATE_3: ${{ secrets.TISTORY_STORAGE_STATE_3 }}
      OPENAI_MODEL: gpt-5.2
      DRY_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) && 'false' || 'true' }}
      POST_INDEX: '0'
      FORCE_TOPIC: ${{ inputs.topic }}
      IMAGE_URLS: ${{ inputs.image_urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure assistant-triggered post
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, os
          with open('.github/publish-trigger.json', encoding='utf-8') as f:
              data = json.load(f)
          topic = str(data.get('topic', '')).strip()
          if not topic:
              raise SystemExit('publish-trigger.json requires a non-empty topic')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('FORCE_TOPIC<<EOF\n')
              f.write(topic + '\n')
              f.write('EOF\n')
          image_urls = data.get('image_urls', '')
          if isinstance(image_urls, list):
              image_urls = ','.join(str(x).strip() for x in image_urls if str(x).strip())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('IMAGE_URLS=' + str(image_urls) + '\n')
          PY
      - name: Apply Kunnotes post rules
        run: python scripts/apply_post_rules.py
      - run: pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Configure scheduled post
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            '0 23 * * *')
              echo 'POST_INDEX=0' >> "$GITHUB_ENV"
              ;;
            '0 3 * * *')
              echo 'POST_INDEX=1' >> "$GITHUB_ENV"
              ;;
            '0 12 * * *')
              echo 'POST_INDEX=2' >> "$GITHUB_ENV"
              ;;
            *)
              echo 'POST_INDEX=0' >> "$GITHUB_ENV"
              ;;
          esac
      - name: Run publisher
        run: python src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-post-${{ github.run_id }}
          path: out/today.json
          retention-days: 7

# Scheduled runs automatically publish one post per slot.
# Manual runs are DRY_RUN by default; enable the "publish" checkbox for a real Tistory post.
# Assistant-triggered runs publish when .github/publish-trigger.json is committed or updated.
