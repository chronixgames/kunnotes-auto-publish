name: Kunnotes Daily Publisher

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Seoul'
    - cron: '0 12 * * *'
      timezone: 'Asia/Seoul'
    - cron: '0 21 * * *'
      timezone: 'Asia/Seoul'
    # One-time pipeline test: 2026-08-21 23:50 KST
    - cron: '50 14 21 8 *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish the generated post to Tistory'
        required: true
        default: false
        type: boolean
      topic:
        description: 'Optional topic for a one-off manual post'
        required: false
        default: '월 100만원 배당 받는 포트폴리오, 현실적으로 얼마가 필요할까?'
        type: string
      image_urls:
        description: 'Comma-separated direct image URLs'
        required: false
        default: 'https://images.pexels.com/photos/7691664/pexels-photo-7691664.jpeg?auto=compress&cs=tinysrgb&w=1200,https://images.pexels.com/photos/6801681/pexels-photo-6801681.jpeg?auto=compress&cs=tinysrgb&w=1200,https://images.pexels.com/photos/7567591/pexels-photo-7567591.jpeg?auto=compress&cs=tinysrgb&w=1200'
        type: string
      image_credits:
        description: 'Optional image credits separated by |'
        required: false
        default: 'Photo by Yan Krukau via Pexels|Photo by Hanna Pad via Pexels|Photo by Tima Miroshnichenko via Pexels'
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
      TISTORY_STORAGE_STATE_1: ${{ secrets.TISTORY_STORAGE_STATE_1 }}
      TISTORY_STORAGE_STATE_2: ${{ secrets.TISTORY_STORAGE_STATE_2 }}
      TISTORY_STORAGE_STATE_3: ${{ secrets.TISTORY_STORAGE_STATE_3 }}
      OPENAI_MODEL: gpt-5.2
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.publish == true && 'false' || 'true') }}
      POST_INDEX: '0'
      FORCE_TOPIC: ${{ inputs.topic }}
      IMAGE_URLS: ${{ inputs.image_urls }}
      IMAGE_CREDITS: ${{ inputs.image_credits }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Configure scheduled post
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            '0 8 * * *')
              echo 'POST_INDEX=0' >> "$GITHUB_ENV"
              ;;
            '0 12 * * *')
              echo 'POST_INDEX=1' >> "$GITHUB_ENV"
              ;;
            '0 21 * * *')
              echo 'POST_INDEX=2' >> "$GITHUB_ENV"
              ;;
            '50 14 21 8 *')
              echo 'POST_INDEX=0' >> "$GITHUB_ENV"
              echo 'FORCE_TOPIC=2026년 하반기 금리 인하 가능성, 투자자는 무엇을 준비해야 할까?' >> "$GITHUB_ENV"
              ;;
            *)
              echo 'POST_INDEX=0' >> "$GITHUB_ENV"
              ;;
          esac
      - name: Run publisher
        run: python src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-post-${{ github.run_id }}
          path: out/today.json
          retention-days: 7

# Scheduled runs automatically publish one post per slot in the 08-09, 12-15, and 21-23 KST windows.
# The publisher waits a random amount within each window before publishing.
# Manual runs are DRY_RUN by default; enable the "publish" checkbox for a real Tistory post.
