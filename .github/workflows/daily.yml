name: Kunnotes Daily Publisher

on:
  schedule:
    - cron: '0 23 * * *'
    - cron: '0 3 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish the generated post to Tistory'
        required: true
        default: false
        type: boolean
      topic:
        description: 'Optional topic for a one-off manual post'
        required: false
        default: '2026년 하반기 금리 인하 가능성, 투자자는 무엇을 준비해야 할까?'
        type: string
      image_urls:
        description: 'Optional comma-separated direct image URLs for a manual override'
        required: false
        default: ''
        type: string
  push:
    paths:
      - '.github/republish-trigger.json'
      - '.github/workflows/daily.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TISTORY_BLOG_NAME: ${{ secrets.TISTORY_BLOG_NAME }}
      TISTORY_STORAGE_STATE_1: ${{ secrets.TISTORY_STORAGE_STATE }}
      TISTORY_STORAGE_STATE_2: ${{ secrets.TISTORY_STORAGE_STATE_1 }}
      TISTORY_STORAGE_STATE_3: ${{ secrets.TISTORY_STORAGE_STATE_2 }}
      OPENAI_MODEL: gpt-5.2
      DRY_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && 'false' || 'true' }}
      POST_INDEX: '0'
      FORCE_TOPIC: ${{ inputs.topic }}
      IMAGE_URLS: ${{ inputs.image_urls }}
      PUBLISH_ASSISTANT: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure assistant-triggered post
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, os
          with open('.github/republish-trigger.json', encoding='utf-8') as f:
              data = json.load(f)
          if not data.get('enabled', False):
              print('Assistant publish trigger is disabled; skipping publisher.')
              raise SystemExit(0)
          topic = str(data.get('topic', '')).strip()
          if not topic:
              raise SystemExit('republish-trigger.json requires a non-empty topic')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('PUBLISH_ASSISTANT=true\n')
              f.write('FORCE_TOPIC<<EOF\n')
              f.write(topic + '\n')
              f.write('EOF\n')
          image_urls = data.get('image_urls', '')
          if isinstance(image_urls, list):
              image_urls = ','.join(str(x).strip() for x in image_urls if str(x).strip())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('IMAGE_URLS=' + str(image_urls) + '\n')
          PY
      - name: Apply Kunnotes post rules
        run: python scripts/apply_post_rules.py
      - name: Apply final Kunnotes formatting rules
        run: python scripts/apply_final_rules.py
      - name: Disable tables for text-first posts
        run: python scripts/disable_tables.py
      - name: Enforce final media and closing rules
        run: python scripts/enforce_media_rules.py
      - name: Repair runtime publisher rules
        run: python scripts/repair_runtime_rules.py
      - run: pip install -r requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Configure scheduled post
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            '0 23 * * *')
              echo 'POST_INDEX=0' >> "$GITHUB_ENV"
              ;;
            '0 3 * * *')
              echo 'POST_INDEX=1' >> "$GITHUB_ENV"
              ;;
            '0 12 * * *')
              echo 'POST_INDEX=2' >> "$GITHUB_ENV"
              ;;
            *)
              echo 'POST_INDEX=0' >> "$GITHUB_ENV"
              ;;
          esac
      - name: Normalize Tistory storage state
        env:
          STATE_A: ${{ secrets.TISTORY_STORAGE_STATE }}
          STATE_B: ${{ secrets.TISTORY_STORAGE_STATE_1 }}
          STATE_C: ${{ secrets.TISTORY_STORAGE_STATE_2 }}
        run: |
          python - <<'PY'
          import base64, gzip, json, os

          chunks = [os.environ.get('STATE_A', ''), os.environ.get('STATE_B', ''), os.environ.get('STATE_C', '')]
          chunks = [''.join(x.split()) for x in chunks if x.strip()]
          if not chunks:
              raise SystemExit('No Tistory storage-state secrets were found.')

          def decode_b64(value):
              return base64.b64decode(value + '=' * (-len(value) % 4), validate=True)

          def valid(raw):
              candidates = [raw]
              if raw[:2] == b'\x1f\x8b':
                  try:
                      candidates.insert(0, gzip.decompress(raw))
                  except Exception:
                      pass
              for candidate in candidates:
                  try:
                      text = candidate.decode('utf-8').strip()
                      if text.startswith('{'):
                          json.loads(text)
                          return candidate
                  except Exception:
                      pass
              return None

          attempts = []

          # Normal case: the three secrets are consecutive pieces of one base64 string.
          joined = ''.join(chunks)
          try:
              attempts.append(('joined-base64', decode_b64(joined)))
          except Exception as exc:
              print(f'joined-base64 decode failed: {type(exc).__name__}')

          # Also support secrets that were each base64-encoded separately before being split.
          try:
              pieces = [decode_b64(x) for x in chunks]
              attempts.append(('per-secret-base64', b''.join(pieces)))
          except Exception as exc:
              print(f'per-secret-base64 decode failed: {type(exc).__name__}')

          # Finally, support the first secret being the complete state by itself.
          if chunks:
              try:
                  attempts.append(('first-secret-only', decode_b64(chunks[0])))
              except Exception:
                  pass

          normalized = None
          method = None
          for name, raw in attempts:
              candidate = valid(raw)
              if candidate is not None:
                  normalized = candidate
                  method = name
                  break

          if normalized is None:
              raise SystemExit('Tistory storage-state secrets are present but none of the supported encodings produced valid JSON/gzip(JSON). Refresh the Tistory session state and replace the three secrets.')

          encoded = base64.b64encode(normalized).decode('ascii')
          print(f'Validated Tistory storage state using {method}; normalized length={len(encoded)}.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('TISTORY_STORAGE_STATE_1<<TISTORY_STATE\n')
              f.write(encoded + '\n')
              f.write('TISTORY_STATE\n')
              f.write('TISTORY_STORAGE_STATE_2=\n')
              f.write('TISTORY_STORAGE_STATE_3=\n')
          PY
      - name: Run publisher
        if: github.event_name != 'push' || env.PUBLISH_ASSISTANT == 'true'
        run: python src/main.py
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || env.PUBLISH_ASSISTANT == 'true'
        with:
          name: daily-post-${{ github.run_id }}
          path: out/today.json
          retention-days: 7

# Scheduled runs automatically publish one post per slot.
# Manual runs are DRY_RUN by default; enable the "publish" checkbox for a real Tistory post.
# Assistant-triggered runs publish when .github/republish-trigger.json is enabled and committed or updated.
